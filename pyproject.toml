[project]
name = "jev-simulator"
version = "0.1.0"
description = "Configurable Jev-compatible decisions from Chat Completions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.urls]
Repository = "https://github.com/ueagohbbcd/jev-simulator"
Documentation = "https://github.com/ueagohbbcd/jev-simulator#readme"
Issues = "https://github.com/ueagohbbcd/jev-simulator/issues"

[project.scripts]
jev-simulator = "jev_gateway.cli:main"
jev-gateway = "jev_gateway.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
