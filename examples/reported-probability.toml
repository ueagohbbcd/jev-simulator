# Direct numerical reports; each question/comparison is a separate call.
[upstream]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"

[upstream.extra_body]
thinking = { type = "disabled" }

[adapter]
mode = "reported_probability"
temperature = 1.0
double_round_robin = false
callsigns = []

[generation]
temperature = 0.0
max_tokens = 1024

[prompt]
system = "Report the probability of each option using the supplied information. Return only the requested JSON object."
user = """
Evidence:
{{state}}

Question:
{{instructions}}

Options:
{{options}}

{{output}}
"""
