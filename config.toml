# The upstream accepts OpenAI-style Chat Completions with first-token logprobs.
[upstream]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
# Enable only after selecting an upstream model that accepts image inputs.
supports_images = false
# Provider-specific field; omit this table for providers that do not support it.
[upstream.extra_body]
thinking = { type = "disabled" }

[adapter]
mode = "token_logprobs"
# Post-processing temperature, not generation temperature. 1 means unchanged.
temperature = 1.0
double_round_robin = false
# Empty means A–Z. A nonempty list replaces letters for Choice/Score only.
callsigns = []

[prompt]
system = "Answer the question using the evidence. Reply with one label, without whitespace."
user = """
Evidence:
{{state}}

Question:
{{instructions}}

Options:
{{options}}

{{output}}
"""

[server]
host = "127.0.0.1"
port = 8080
# Optional downstream authentication; separate from the upstream key.
# api_key_env = "JEV_GATEWAY_API_KEY"

[diagnostics]
low_mass_threshold = 0.99
